name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Palette meets WCAG AA
        run: node scripts/check-contrast.mjs

      - name: Content validates
        run: node scripts/validate-content.mjs

      - name: No duplicate insights within a book
        run: node scripts/find-duplicates.mjs --threshold 0.45

      - name: Content builds
        run: npm run content:build

      - name: Seed SQL generates
        run: npm run content:sql

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test
